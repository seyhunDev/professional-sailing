<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1724">
  <title>Velora Sailing · Taktik Animasyonları</title>
  <link rel="icon" href="img/velora-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/velora-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pg-index">
  <!-- SİMGELER (tek yerde; <use href="#i-..."> ile kullanılır) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 100 100"><rect width="100" height="100" rx="23" fill="#0b1a33"/><circle cx="50" cy="52" r="30" fill="#fff"/><path d="M26 19 L35.6 19 C 42 35, 46 47.8, 50 55.8 L59.6 19 L74 19 L56.4 67 L43.6 67 Z" fill="#0b1a33"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="4" height="13" rx="1" fill="currentColor"/><rect x="13.5" y="5.5" width="4" height="13" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5.5M12 7.6v.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5 21 8.5 12 13.5 3 8.5z M3.5 12.5 12 17.3l8.5-4.8 M3.5 16.3 12 21l8.5-4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-boat" viewBox="0 0 24 24"><path d="M12 3c3 3.5 4 8 3.5 15h-7C8 11 9 6.5 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-steps" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </svg>

  <!-- ÜST ÇUBUK -->
  <header class="topbar">
    <button id="btnScenarios" class="scn-btn" title="Senaryo seç" aria-haspopup="dialog">
      <span class="code-badge" id="curCode"></span>
      <span class="scn-title" id="curTitle">Senaryo seç</span>
      <svg class="chev"><use href="#i-chev-down"/></svg>
    </button>
    <div class="spacer"></div>
    <div class="tool-group">
      <a id="lnkSim" class="tool sim-link" href="sim.html" title="Yarış simülatörü: tekneleri kendin yerleştir, rüzgarı değiştir"><svg><use href="#i-boat"/></svg><span class="lbl">Simülatör</span></a>
      <button id="btnInfo" class="tool" title="Bilgi kartı (i)"><svg><use href="#i-info"/></svg><span class="lbl">Bilgi</span></button>
      <button id="btnLayers" class="tool" title="Katmanlar"><svg><use href="#i-layers"/></svg><span class="lbl">Katmanlar</span></button>
    </div>
  </header>

  <!-- SAHNE -->
  <main class="stage">
    <svg id="course" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
        </marker>
      </defs>
      <g id="windLayer"></g>
      <g id="courseLayer"></g>
      <g id="overlayLayer"></g>
      <g id="boatLayer"></g>
      <g id="hudLayer"></g>
    </svg>

    <!-- MARKA: sahnenin sol alt köşesi (tıklanmaz, sahneyi kapatmaz) -->
    <div class="brand-corner" aria-label="Velora Sailing"><svg><use href="#i-logo"/></svg><span>Velora <em>Sailing</em></span></div>

    <!-- BİLGİ KARTI -->
    <aside id="infoCard" class="info-card">
      <!-- tek satır: adım sayacı solda, düğmeler sağda (hepsi aynı yükseklikte, ortalı) -->
      <div class="info-head" id="infoHead">
        <button class="handle" id="btnCollapse" title="Daralt / genişlet"><span></span></button>
        <div class="step-meta" id="stepIdx"></div>
        <button id="btnGoto" class="goto-pill hidden" title="Animasyonu bu adımın anına götür ve izlemeye dön"><svg><use href="#i-target"/></svg><span>Bu ana git</span></button>
        <div class="step-nav">
          <button id="btnPrev" class="icon" title="Önceki adım (←)" aria-label="Önceki adım"><svg><use href="#i-prev"/></svg></button>
          <button id="btnNext" class="icon" title="Sonraki adım (→)" aria-label="Sonraki adım"><svg><use href="#i-next"/></svg></button>
        </div>
        <button id="btnInfoClose" class="icon" title="Kapat" aria-label="Kartı kapat"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="step-bar" id="stepBar"></div>
      <h3 class="step-title" id="stepTitle"></h3>
      <div class="info-scroll" id="infoScroll">
        <div class="info-body">
          <p id="stepText"></p>
        </div>
        <div class="boats-box">
          <div class="legend" id="legend"></div>
        </div>
        <details class="summary-box">
          <summary>Senaryo özeti ve simgeler</summary>
          <p id="scnSummary"></p>
          <div class="key" id="roleKey"></div>
        </details>
      </div>
    </aside>

    <!-- KATMANLAR -->
    <div id="layersMenu" class="popover layers hidden">
      <div class="pop-title">Katmanlar</div>
      <label class="switch row-sw"><span class="sw-lbl">Rüzgar çizgileri</span><input type="checkbox" id="chkWind" checked><span class="track"><span class="knob"></span></span></label>
      <label class="switch row-sw"><span class="sw-lbl">Merdiven basamağı</span><input type="checkbox" id="chkRungs" checked><span class="track"><span class="knob"></span></span></label>
      <label class="switch row-sw"><span class="sw-lbl">Tekne etiketleri</span><input type="checkbox" id="chkLabels" checked><span class="track"><span class="knob"></span></span></label>
      <label class="switch row-sw"><span class="sw-lbl">Pis rüzgar (gölge)</span><input type="checkbox" id="chkShadows" checked><span class="track"><span class="knob"></span></span></label>
      <label class="switch row-sw"><span class="sw-lbl">Tekne izleri</span><input type="checkbox" id="chkTrails"><span class="track"><span class="knob"></span></span></label>
      <label class="switch row-sw" title="Sahneyi teknelere yakın sığdırır, gerekirse olayı izler (telefonda varsayılan açık)"><span class="sw-lbl">Yakın görünüm</span><input type="checkbox" id="chkZoom"><span class="track"><span class="knob"></span></span></label>
      <label class="switch row-sw" id="rowFull"><span class="sw-lbl">Tam ekran</span><input type="checkbox" id="chkFull"><span class="track"><span class="knob"></span></span></label>
      <div class="pop-foot version" id="versionLabel"></div>
    </div>

    <!-- TEKNE EKLE (şimdilik kapalı; kod duruyor) -->
    <div id="addMenu" class="popover add-popover hidden">
      <div class="row">
        <select id="selSide" class="tb"></select>
        <select id="selTack" class="tb">
          <option value="starboard">Sancak kontra</option>
          <option value="port">İskele kontra</option>
        </select>
      </div>
      <div class="row">
        <button id="btnAdd" class="tb grow">+ Tekne ekle</button>
        <button id="btnRemove" class="tb grow">− Son tekneyi çıkar</button>
      </div>
    </div>

    <!-- SENARYO SEÇİCİ -->
    <div id="picker" class="picker hidden" role="dialog" aria-label="Senaryo seç">
      <div class="picker-panel">
        <div class="picker-head">
          <h2>Senaryolar</h2>
          <button id="btnPickerClose" class="icon" title="Kapat (Esc)"><svg><use href="#i-close"/></svg></button>
        </div>
        <div class="picker-tools">
          <label class="search"><svg><use href="#i-search"/></svg><input id="pickerSearch" type="search" placeholder="Ara: kural, start, layline…" autocomplete="off"></label>
          <div class="picker-tabs" id="pickerTabs" role="tablist"></div>
        </div>
        <div class="picker-list" id="pickerList"></div>
      </div>
    </div>
  </main>

  <!-- ALT ÇUBUK -->
  <footer class="bottombar">
    <div class="row main-row">
      <button id="btnPlay" class="play" title="Oynat / duraklat (boşluk)"><svg><use href="#i-play"/></svg></button>
      <button id="btnReset" class="tool" title="Başa al"><svg><use href="#i-reset"/></svg></button>
      <div class="timeline">
        <input type="range" id="scrub" min="0" max="100" step="0.05" value="0" aria-label="Zaman">
        <div class="ticks" id="ticks"></div>
      </div>
      <span class="time" id="timeLabel">0:00</span>
      <div class="speed" id="speedSeg" role="radiogroup" aria-label="Hız">
        <button data-v="0.5">0.5×</button><button data-v="1" class="on">1×</button><button data-v="2">2×</button>
      </div>
      <button id="btnAddMenu" class="tb add-btn" title="Tekne ekle / çıkar">⛵ +</button>
    </div>
    <div class="row add-row" id="addRow"></div>
  </footer>

  <script src="js/track.js"></script>
  <script src="js/access.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/thumbs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
