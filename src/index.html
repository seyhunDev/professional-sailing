<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Professional Sailing · Taktik Animasyonları</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ÜST ÇUBUK -->
  <header class="topbar">
    <div class="brand">⛵ Professional <span>Sailing</span></div>
    <select id="selScenario" class="scenario-select" title="Senaryo seç"></select>
    <div class="spacer"></div>
    <button id="btnInfo" class="tb" title="Bilgi kartını aç/kapat">ℹ Bilgi</button>
    <button id="btnLayers" class="tb" title="Katmanlar">◫ Katmanlar</button>
    <button id="btnFull" class="tb" title="Tam ekran">⛶</button>
  </header>

  <!-- SAHNE -->
  <main class="stage">
    <svg id="course" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
        </marker>
      </defs>
      <g id="windLayer"></g>
      <g id="courseLayer"></g>
      <g id="overlayLayer"></g>
      <g id="boatLayer"></g>
      <g id="hudLayer"></g>
    </svg>

    <!-- BİLGİ KARTI (sahnenin üstünde yüzer) -->
    <aside id="infoCard" class="info-card">
      <div class="info-head">
        <div class="info-title-wrap">
          <div class="info-scn" id="scnTitle"></div>
        </div>
        <label class="follow" title="Açıkken kart animasyonla birlikte ilerler">
          <input type="checkbox" id="chkFollow" checked> <span>Canlı takip</span>
        </label>
        <button id="btnInfoClose" class="icon" title="Kapat">✕</button>
      </div>
      <div class="info-body">
        <div class="step-meta"><span id="stepIdx"></span> · <span id="stepTime"></span></div>
        <h3 id="stepTitle"></h3>
        <p id="stepText"></p>
      </div>
      <div class="info-foot">
        <button id="btnPrev" class="tb">‹ Önceki</button>
        <button id="btnGoto" class="tb" title="Animasyonu bu adımın anına götür">⤓ Bu ana git</button>
        <button id="btnNext" class="tb">Sonraki ›</button>
      </div>
      <details class="summary-box">
        <summary>Senaryo özeti ve tekneler</summary>
        <p id="scnSummary"></p>
        <div class="legend" id="legend"></div>
      </details>
    </aside>

    <!-- KATMANLAR MENÜSÜ -->
    <div id="layersMenu" class="layers-menu hidden">
      <label><input type="checkbox" id="chkWind" checked> Rüzgar çizgileri</label>
      <label><input type="checkbox" id="chkRungs" checked> Merdiven basamağı</label>
      <label><input type="checkbox" id="chkLabels" checked> Tekne isimleri</label>
      <label><input type="checkbox" id="chkTrails"> Tekne izleri</label>
    </div>
  </main>

  <!-- ALT ÇUBUK -->
  <footer class="bottombar">
    <div class="row">
      <button id="btnPlay" class="primary">▶ Oynat</button>
      <button id="btnReset" class="tb">↺</button>
      <select id="selSpeed" class="tb" title="Hız">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
      </select>
      <span class="time" id="timeLabel">0.0 s</span>
      <input type="range" id="scrub" min="0" max="100" step="0.05" value="0">
    </div>
    <div class="row add-row">
      <span class="lbl">Tekne ekle</span>
      <select id="selSide" class="tb"></select>
      <select id="selTack" class="tb">
        <option value="starboard">Sancak kontra</option>
        <option value="port">İskele kontra</option>
      </select>
      <button id="btnAdd" class="tb">+ Ekle</button>
      <button id="btnRemove" class="tb">− Çıkar</button>
      <span class="spacer"></span>
      <span class="version" id="versionLabel"></span>
    </div>
  </footer>

  <script src="js/engine.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
