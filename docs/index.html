<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Professional Sailing · Taktik Animasyonları</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>⛵ Professional <span>Sailing</span></h1>
    <div class="sub">Yarış hazırlığı · taktik ve kural animasyonları</div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>

    <section class="stage">
      <div class="canvas-wrap">
        <svg id="course" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet">
          <defs>
            <radialGradient id="waterGrad" cx="50%" cy="40%" r="80%">
              <stop offset="0%" stop-color="#0d4b78"/><stop offset="100%" stop-color="#072d4a"/>
            </radialGradient>
            <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
            </marker>
          </defs>
          <rect width="1000" height="680" fill="url(#waterGrad)"/>
          <g id="windLayer"></g>
          <g id="courseLayer"></g>
          <g id="overlayLayer"></g>
          <g id="boatLayer"></g>
          <g id="hudLayer"></g>
        </svg>
      </div>
      <div class="controls">
        <div class="group">
          <button id="btnPlay" class="primary">▶ Oynat</button>
          <button id="btnReset">↺ Başa al</button>
        </div>
        <div class="group">
          <label>Hız</label>
          <select id="selSpeed">
            <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
          </select>
        </div>
        <div class="group">
          <label>Tekne ekle:</label>
          <select id="selSide"></select>
          <select id="selTack">
            <option value="starboard">Sancak kontra</option>
            <option value="port">İskele kontra</option>
          </select>
          <button id="btnAdd">+ Ekle</button>
          <button id="btnRemove">− Son tekneyi çıkar</button>
        </div>
        <div class="group">
          <label><input type="checkbox" id="chkWind" checked> Rüzgar çizgileri</label>
          <label><input type="checkbox" id="chkRungs" checked> Merdiven basamağı</label>
          <label><input type="checkbox" id="chkLabels" checked> İsimler</label>
          <label><input type="checkbox" id="chkTrails"> İz</label>
        </div>
        <div class="scrub">
          <span class="time" id="timeLabel">0.0 s</span>
          <input type="range" id="scrub" min="0" max="100" step="0.05" value="0">
        </div>
      </div>
    </section>

    <aside class="explain">
      <h2 id="scnTitle"></h2>
      <div class="summary" id="scnSummary"></div>
      <div class="legend" id="legend"></div>
      <div id="steps"></div>
      <div class="hint">Adımlara tıklayarak o ana atlayabilirsiniz. "Tekne ekle" ile senaryoya aynı kurallarla seyreden ek tekneler koyup kalabalık varyasyonlar üretebilirsiniz.</div>
    </aside>
  </div>
  <script src="js/engine.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
